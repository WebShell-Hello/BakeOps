name: bakeops-prod

services:
  postgres:
    image: postgres:17-alpine
    container_name: BO-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - bakeops

  backend:
    build:
      context: ./backend
      target: production
    container_name: BO-prod-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2).close()\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - bakeops

  frontend:
    build:
      context: ./frontend
      target: production
    container_name: BO-prod-frontend
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      PORT: 3000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - bakeops

  caddy:
    image: caddy:2-alpine
    container_name: BO-prod-caddy
    restart: unless-stopped
    environment:
      BAKEOPS_DOMAIN: ${BAKEOPS_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - bakeops

volumes:
  postgres_data:
    name: BO-prod-postgres-data
  caddy_data:
    name: BO-prod-caddy-data
  caddy_config:
    name: BO-prod-caddy-config

networks:
  bakeops:
    name: BO-prod-network
